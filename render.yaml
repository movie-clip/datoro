# ==============================================
# Render.com Deployment Configuration
# ==============================================
# This blueprint defines all services for automated deployment
# Connect to GitHub and Render will auto-deploy from this file

services:
  # ==============================================
  # Backend API Server (Node.js + PM2)
  # ==============================================
  - type: web
    name: factorly-api
    runtime: node
    plan: free # FREE: sleeps after 15min inactivity | STARTER ($7/mo): 24/7 uptime
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node scripts/clear-redis-cache.mjs
    startCommand: node server/server.mjs
    healthCheckPath: /api/health
    
    # Only rebuild backend when these files change
    buildFilter:
      paths:
        - server/**
        - prisma/**
        - package.json
        - package-lock.json
      ignoredPaths:
        - src/**
        - public/**
        - "*.md"
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 7071
      
      # REQUIRED: Set manually in Render dashboard
      - key: FMP_API_KEY
        sync: false
      
      # REQUIRED: Set manually in Render dashboard (authentication)
      # Generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # Auto-populated from database service
      - key: DATABASE_URL
        fromDatabase:
          name: factorly-db
          property: connectionString
      
      # Auto-populated from Redis service
      - key: REDIS_URL
        fromService:
          name: factorly-redis
          type: keyvalue
          property: connectionString
      
      # OPTIONAL: Set manually if using Sentry
      - key: SENTRY_DSN
        sync: false
      
      # CORS: Allow frontend domain(s)
      # For multiple origins: https://domain1.com,https://domain2.com
      - key: ALLOWED_ORIGINS
        value: https://factorly.onrender.com
      
      - key: DEV_ORIGIN
        value: https://factorly.onrender.com

  # ==============================================
  # Redis Cache (Key-Value Store)
  # ==============================================
  - type: keyvalue
    name: factorly-redis
    plan: free # FREE: 25MB storage
    maxmemoryPolicy: allkeys-lru # Auto-evict least recently used keys when full
    ipAllowList: [] # Empty = allow all Render services

  # ==============================================
  # Frontend Static Site (Vue 3 + Vite)
  # ==============================================
  - type: web
    name: factorly
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true # Auto-preview pull requests
    
    # Environment Variables (injected during build)
    envVars:
      - key: VITE_API_BASE_URL
        value: https://factorly-api.onrender.com
    
    # Only rebuild frontend when these files change
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - vite.config.js
        - package.json
        - package-lock.json
      ignoredPaths:
        - server/**
        - prisma/**
        - "*.md"
    
    # HTTP Headers
    headers:
      # Cache static assets for 1 hour
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      
      # Content Security Policy
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://factorly-api.onrender.com; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    
    # SPA routing: redirect all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==============================================
# PostgreSQL Database
# ==============================================
databases:
  - name: factorly-db
    databaseName: financeview
    user: financeview
    plan: free # FREE: 90 days trial, then $7/month
    ipAllowList: [] # Empty = allow all Render services

# ==============================================
# DEPLOYMENT CHECKLIST
# ==============================================
# After blueprint is deployed:
#
# 1. Set required secrets in Render dashboard:
#    - FMP_API_KEY (get from financialmodelingprep.com)
#
# 2. Optional: Set monitoring if using Sentry:
#    - SENTRY_DSN (for error tracking)
#
# 3. Update ALLOWED_ORIGINS if using custom domain:
#    - Add your production domain(s)
#    - Add www subdomain if needed
#
# 4. Update frontend VITE_API_BASE_URL:
#    - Change to your custom backend domain if not using default
#
# 5. Update CSP header in frontend headers:
#    - Update connect-src with your backend domain
#
# Note: AI insights are pre-generated and served as static JSON files
#       No API keys needed for AI features in production
#
# For detailed deployment guide, see: DEPLOYMENT_CHECKLIST.md

