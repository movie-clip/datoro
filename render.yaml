# Render.com Blueprint Configuration
# This file defines all services, databases, and environment variables
# Render will auto-deploy from this configuration when connected to GitHub

services:
  # Backend API Server
  - type: web
    name: factorly-api
    runtime: node
    region: oregon # or frankfurt, singapore (choose closest to users)
    plan: free # free tier (sleeps after 15min inactivity) - upgrade to starter ($7/mo) for 24/7
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server/server.mjs
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - prisma/**
        - package.json
        - package-lock.json
      ignoredPaths:
        - src/**
        - public/**
        - "*.md"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7071
      - key: FMP_API_KEY
        sync: false # Set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: factorly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: factorly-redis
          type: keyvalue
          property: connectionString
      - key: SENTRY_DSN
        sync: false # Optional - set manually if using Sentry
      - key: VITE_OPENAI_API_KEY
        sync: false # Optional - set manually if using AI features
      - key: VITE_AI_PROVIDER
        value: openai
      - key: ALLOWED_ORIGINS
        value: https://factorly.onrender.com
      - key: DEV_ORIGIN
        value: https://factorly.onrender.com

  # Redis Cache (Key Value Instance)
  - type: keyvalue
    name: factorly-redis
    region: oregon
    plan: free # 25MB free
    maxmemoryPolicy: allkeys-lru # Evict least recently used keys when full
    ipAllowList: [] # Empty = allow all (Render services auto-allowed)

  # Frontend Static Site
  - type: web
    name: factorly
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true # Preview PRs before merging
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - vite.config.js
        - package.json
        - package-lock.json
      ignoredPaths:
        - server/**
        - prisma/**
        - "*.md"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600 # Cache static assets for 1 hour
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://factorly-api.onrender.com; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://factorly-api.onrender.com

# PostgreSQL Database
databases:
  - name: factorly-db
    databaseName: financeview
    user: financeview
    plan: free # 90 days free, then $7/month
    region: oregon
    ipAllowList: [] # Empty = allow all (Render services auto-allowed)
