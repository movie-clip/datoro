# ==============================================
# Render.com Deployment Configuration
# ==============================================
# This blueprint defines all services for automated deployment
# Connect to GitHub and Render will auto-deploy from this file

services:
  # ==============================================
  # Backend API Server (Node.js)
  # ==============================================
  - type: web
    name: datoro-api
    runtime: node
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: node --import tsx server/server.ts
    healthCheckPath: /api/health
    
    # Only rebuild backend when these files change
    buildFilter:
      paths:
        - server/**
        - prisma/**
        - package.json
        - package-lock.json
      ignoredPaths:
        - src/**
        - public/**
        - "*.md"
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      
      # REQUIRED: Set manually in Render dashboard
      - key: FMP_API_KEY
        sync: false
      
      # REQUIRED: Set manually in Render dashboard (authentication)
      # Generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      # RECOMMENDED: Protect admin/ops endpoints (cache clear, monitoring reset, DB pool stats)
      # Send requests with: X-Admin-Key: <value>
      - key: ADMIN_API_KEY
        sync: false
      
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # Database connection for Prisma migrations and runtime.
      # Keep this managed by Render via fromDatabase so the service uses
      # the private-network connection string instead of a manual external URL.
      - key: DATABASE_URL
        sync: false
      
      # Redis connection for cache and rate limiting
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: datoro-redis
          property: connectionString
      
      # OPTIONAL: Set manually if using Sentry
      - key: SENTRY_DSN
        sync: false
      
      # Stripe Subscription System
      # REQUIRED: Set manually in Render dashboard
      # Get from: https://dashboard.stripe.com/apikeys
      - key: STRIPE_SECRET_KEY
        sync: false
      
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      
      - key: STRIPE_PRICE_ID
        sync: false
      
      # CORS: Allow frontend domain(s)
      # For multiple origins: https://domain1.com,https://domain2.com
      - key: ALLOWED_ORIGINS
        value: https://datoro.onrender.com
      
      - key: DEV_ORIGIN
        value: https://datoro.onrender.com
      
      # Frontend URL (for Stripe redirects and email links)
      - key: APP_URL
        value: https://datoro.onrender.com
    
  # ==============================================
  # Redis Cache (Key-Value Store)
  # ==============================================
  - type: keyvalue
    name: datoro-redis
    maxmemoryPolicy: allkeys-lru # Auto-evict least recently used keys when full
    ipAllowList: [] # Empty = allow all Render services

  # ==============================================
  # Frontend Static Site (Vue 3 + Vite)
  # ==============================================
  - type: web
    name: datoro
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: automatic
    
    # Environment Variables (injected during build)
    envVars:
      - key: VITE_API_BASE_URL
        value: https://datoro-api.onrender.com
    
    # Only rebuild frontend when these files change
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - vite.config.ts
        - package.json
        - package-lock.json
      ignoredPaths:
        - server/**
        - prisma/**
        - "*.md"
    
    # HTTP Headers
    headers:
      # Cache static assets for 1 hour
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      
      # Content Security Policy - Allow Google Analytics and ECharts
      # 'unsafe-eval' required for ECharts dynamic function generation
      # 'wasm-unsafe-eval' is safer alternative but 'unsafe-eval' needed for compatibility
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://datoro-api.onrender.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    
    # SPA routing: redirect all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==============================================
# PostgreSQL Database
# ==============================================
databases:
  - name: datoro-db
    databaseName: datoro
    user: datoro
    ipAllowList: [] # Private-only database; use internal connection string from Render

# ==============================================
# DEPLOYMENT CHECKLIST
# ==============================================
# After blueprint is deployed:
#
# 1. Set required secrets in Render dashboard:
#    - FMP_API_KEY (get from financialmodelingprep.com)
#    - JWT_SECRET (generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))")
#
# 2. Set Stripe keys (REQUIRED for subscription features):
#    - STRIPE_SECRET_KEY (from https://dashboard.stripe.com/apikeys)
#    - STRIPE_PUBLISHABLE_KEY (from https://dashboard.stripe.com/apikeys)
#    - STRIPE_PRICE_ID (your subscription price ID, e.g., price_1XXXXX)
#    - STRIPE_WEBHOOK_SECRET (from https://dashboard.stripe.com/webhooks)
#      * Create webhook endpoint: https://datoro-api.onrender.com/api/webhooks/stripe
#      * Select events: checkout.session.completed, customer.subscription.*, invoice.payment_*
#
# 3. CRITICAL: APP_URL is auto-set in render.yaml to https://datoro.onrender.com
#    - If using custom domain, update APP_URL in Render dashboard manually
#    - This controls Stripe redirects and email links
#
# 4. Optional: Set monitoring if using Sentry:
#    - SENTRY_DSN (for error tracking)
#
# 5. Update ALLOWED_ORIGINS if using custom domain:
#    - Add your production domain(s)
#    - Add www subdomain if needed
#
# 6. Update frontend VITE_API_BASE_URL:
#    - Change to your custom backend domain if not using default
#
# 7. Update CSP header in frontend headers:
#    - Update connect-src with your backend domain
#
# Note: AI insights are pre-generated and served as static JSON files
#       No API keys needed for AI features in production
#
# For detailed deployment guide, see: DEPLOYMENT_CHECKLIST.md
