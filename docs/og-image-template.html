<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorly OG Image Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Gradient overlay for depth */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 30% 40%, rgba(124, 58, 237, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 60px;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin-bottom: 40px;
      filter: drop-shadow(0 10px 30px rgba(124, 58, 237, 0.5));
    }

    h1 {
      font-size: 90px;
      font-weight: 800;
      margin: 0 0 20px 0;
      background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      line-height: 1;
    }

    h2 {
      font-size: 38px;
      font-weight: 500;
      margin: 0 0 50px 0;
      color: #e5e7eb;
      letter-spacing: 0.5px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 40px;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 30px;
      background: rgba(124, 58, 237, 0.1);
      border-radius: 16px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      backdrop-filter: blur(10px);
    }

    .feature-icon {
      font-size: 40px;
      line-height: 1;
    }

    .feature-text {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    .badge {
      position: absolute;
      top: 40px;
      right: 40px;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      color: white;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
    }

    /* Decorative elements */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.1);
      filter: blur(60px);
    }

    .circle-1 {
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
    }

    .circle-2 {
      width: 300px;
      height: 300px;
      bottom: -80px;
      right: -80px;
      background: rgba(168, 85, 247, 0.1);
    }
  </style>
</head>
<body>
  <!-- Decorative circles -->
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <!-- Free badge -->
  <div class="badge">100% FREE</div>

  <!-- Main content -->
  <div class="container">
    <!-- Replace logo.png with your actual logo path -->
    <img class="logo" src="logo.png" alt="Factorly Logo">
    
    <h1>Factorly</h1>
    <h2>Free Stock Analysis with AI Insights</h2>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">📊</div>
        <div class="feature-text">10,000+ Stocks</div>
      </div>
      
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-text">AI-Powered</div>
      </div>
      
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <div class="feature-text">Real-Time Data</div>
      </div>
    </div>
  </div>
</body>
</html>
