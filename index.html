<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📊</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Factorly - Free Stock Analysis with AI Insights | 10,000+ Stocks</title>
    <meta name="title" content="Factorly - Free Stock Analysis with AI Insights | 10,000+ Stocks" />
    <meta name="description" content="Professional stock analysis dashboard with real-time financial data, AI-powered insights, interactive charts, and comprehensive metrics. Completely free. No signup required. Analyze revenue, P/E ratios, cash flow, and more for any stock." />
    <meta name="keywords" content="stock analysis, financial data, stock charts, P/E ratio, revenue analysis, AI stock insights, free stock data, stock dashboard, financial metrics, stock screener, investment analysis" />
    <meta name="author" content="Factorly" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Open Graph / Facebook / Instagram / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://factorly.com/" />
    <meta property="og:title" content="Factorly - Free Stock Analysis with AI Insights" />
    <meta property="og:description" content="Professional stock analysis with real-time data, AI insights, and interactive charts. 100% free. No signup required. 10,000+ stocks covered." />
    <meta property="og:image" content="https://factorly.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Factorly" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://factorly.com/" />
    <meta name="twitter:title" content="Factorly - Free Stock Analysis with AI Insights" />
    <meta name="twitter:description" content="Real-time financial data + AI-powered insights for 10,000+ stocks. Completely free. No signup. Try it now! 📊" />
    <meta name="twitter:image" content="https://factorly.com/twitter-card.png" />
    <meta name="twitter:creator" content="@factorly" />
    <meta name="twitter:site" content="@factorly" />
    
    <!-- TikTok (uses OG tags primarily, but these help) -->
    <meta property="tiktok:app_id" content="YOUR_TIKTOK_APP_ID" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#1a1a1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Factorly" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://factorly.com/" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    
    <!-- DNS prefetch for faster API calls -->
    <link rel="dns-prefetch" href="https://financialmodelingprep.com" />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.js" />
    <link rel="preload" href="/logo.png" as="image" fetchpriority="high" />
    
    <!-- Preload tab icons (visible immediately on page load) -->
    <link rel="preload" href="/icons/performance.png" as="image" />
    <link rel="preload" href="/icons/valuation.png" as="image" />
    <link rel="preload" href="/icons/balance.png" as="image" />
    <link rel="preload" href="/icons/returns.png" as="image" />
    <link rel="preload" href="/icons/ai.png" as="image" />
    
    <!-- Inline critical CSS for instant render -->
    <style>
      /* Critical CSS - Prevents FOUC */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #1a1a1d;
        color: white;
        overflow-x: hidden;
      }
      #app {
        min-height: 100vh;
      }
    </style>
    
    <!-- Structured Data (JSON-LD) for Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Factorly",
      "description": "Professional stock analysis dashboard with real-time financial data, AI-powered insights, interactive charts, and comprehensive metrics. Completely free. No signup required.",
      "url": "https://factorly.com",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time stock data for 10,000+ stocks",
        "AI-powered financial insights",
        "Interactive charts and visualizations",
        "Revenue and profit analysis",
        "P/E ratio and valuation metrics",
        "Cash flow analysis",
        "Balance sheet data",
        "Insider trading tracking"
      ],
      "screenshot": "https://factorly.com/og-image.png",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1250",
        "bestRating": "5",
        "worstRating": "1"
      },
      "author": {
        "@type": "Organization",
        "name": "Factorly",
        "url": "https://factorly.com"
      }
    }
    </script>
    
    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Factorly",
      "url": "https://factorly.com",
      "logo": "https://factorly.com/logo.png",
      "sameAs": [
        "https://twitter.com/factorly",
        "https://www.linkedin.com/company/factorly"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "support@factorly.com"
      }
    }
    </script>
    
    <!-- Breadcrumb Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://factorly.com"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Stock Analysis",
          "item": "https://factorly.com/#/analysis"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- App Shell - Shows immediately while JS loads -->
      <div id="app-shell" style="
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a1d 0%, #2d2d30 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      ">
        <!-- Logo and Loading Animation -->
        <div style="text-align: center;">
          <h1 style="font-size: 32px; font-weight: 700; margin: 0 0 12px 0; letter-spacing: -0.5px;">
            Factorly
          </h1>
          
          <!-- Loading Spinner -->
          <div style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4a9eff;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
          "></div>
          
          <p style="font-size: 14px; color: #666; margin-top: 24px;">
            Loading application...
          </p>
        </div>
      </div>
      
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.8; transform: scale(1.05); }
        }
        /* Hide shell once Vue app mounts */
        #app:not(:empty) #app-shell {
          display: none;
        }
      </style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
