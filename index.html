  <body>
    <div id="app">
      <!-- App Shell - Shows immediately while JS loads -->
      <div id="app-shell" style="
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a1d 0%, #2d2d30 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      ">
        <!-- Logo and Loading Animation -->
        <div style="text-align: center;">
          <h1 style="font-size: 32px; font-weight: 700; margin: 0 0 12px 0; letter-spacing: -0.5px;">
            Datoro
          </h1>
          
          <!-- Loading Spinner -->
          <div style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4a9eff;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
          "></div>
          
          <p style="font-size: 14px; color: #666; margin-top: 24px;">
            Loading application...
          </p>
        </div>
      </div>
      
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.8; transform: scale(1.05); }
        }
        /* Hide shell once Vue app mounts */
        #app:not(:empty) #app-shell {
          display: none;
        }
      </style>
    </div>
    
    <!-- Global error handler for debugging mobile issues -->
    <script>
      window.addEventListener('error', function(event) {
        console.error('Global error:', event.error);
        var shell = document.getElementById('app-shell');
        if (shell) {
          var errorDiv = document.createElement('div');
          errorDiv.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 12px; padding: 20px; max-width: 90%; color: #fff; z-index: 10000;';
          errorDiv.innerHTML = '<h3 style="color: #ef4444; margin: 0 0 12px 0;">Error Loading App</h3><p style="margin: 0; font-size: 14px;">' + (event.error ? event.error.message : 'Unknown error') + '</p><button onclick="location.reload()" style="margin-top: 16px; padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">Reload</button>';
          document.body.appendChild(errorDiv);
        }
      });
      
      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled promise rejection:', event.reason);
      });
    </script>
